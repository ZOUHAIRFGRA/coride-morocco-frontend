name: Test

on:
  workflow_dispatch:   
    inputs:
      branch:
        description: 'Branch to Test'
        required: true
        default: 'master'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm run test
